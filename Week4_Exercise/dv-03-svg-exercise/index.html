<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/main.css">
  <title>House and Garden</title>
</head>
<body>
  <h1>Step 1: My House and Garden</h1>

  <div class="svg-container">
    <svg viewBox="0 0 500 350"
      xmlns="http://www.w3.org/2000/svg">

      <rect x="0" y="0" width="500" height="250" fill="skyblue"/>
      <rect x="0" y="250" width="500" height="120" fill="lightgreen"/>

      <circle cx="450" cy="50" r="30" fill="yellow"/>

      <rect x="75" y="200" width="10" height="70" fill="saddlebrown"/>
      <circle cx="65" cy="205" r="20" fill="green"/>
      <circle cx="95" cy="205" r="20" fill="green"/>
      <circle cx="80" cy="215" r="20" fill="green"/>

      
      <rect x="279" y="109" width="42" height="10" fill="#c9761e" stroke="saddlebrown" stroke-width="3"/>
      <rect x="285" y="120" width="30" height="60" fill="#c9761e" stroke="saddlebrown" stroke-width="3"/>


      <path d="M 135 200 L 335 200 L 235 100 Z" fill="peru" stroke="saddlebrown" stroke-width="3"/>

      <rect x="135" y="200" width="200" height="70" fill="wheat" stroke="saddlebrown" stroke-width="3"/>

      <rect x="215" y="230" width="30" height="39" fill="brown"/>
      <circle cx="240" cy="250" r="2" fill="black"/>

      <g class="window" transform="translate(0, -5)">
        <rect x="165" y="225" width="25" height="25"/>
        <rect x="275" y="225" width="25" height="25"/>
      </g>

      <path d="M 215 270 L 245 270 L 290 350 L 170 350 Z" fill="tan" stroke="saddlebrown" stroke-width="3"/>

      <text x="350" y="270" font-size="18">House</text>
    </svg>
  </div>

  <h2>Step 2: SVG Coordinate System</h2>
  <div class="step2">
    <p>
      This annotated image shows how the coordinates in the SVG code correspond to the positions and dimensions of the shapes in my drawing.
    </p>

    <img
      src="img/annotated-svg.png"
      alt="Annotated SVG coordinate system showing the sun, house body and garden path"
      class="annotated_img"
    >
  </div>
</body>
</html>
