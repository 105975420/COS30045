<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Energy Consumption</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <h1>TV Energy Consumption by Screen Type</h1>
        <p>Average energy consumption of 55-inch TVs (kWh/year).</p>

        <div class="responsive-svg-container">
            <div id="bar-chart"></div>
            <p>Average Price per MWh over Time (1998-2024)</p>
            <div id="line-chart"></div>
            <p>Total Count by Screen Size Category (Small, Medium, Large)</p>
            <div id="donut-chart"></div>
        </div>
    </main>

    <!-- Load D3 library first -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <script src="js/barChart.js"></script>
    <script src="js/line-chart.js"></script>
    <script src="js/donut-chart.js"></script>
</body>
</html>
